name: Testar credenciais locais
on:
  push:
    branches: [acr-os-pro-local]
    paths:
      - 'scripts/local-password-v1.js'
      - 'scripts/test-local-password.cjs'
      - '.github/workflows/test-local-password.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credenciais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/local-password-v1.js
      - run: node scripts/test-local-password.cjs
