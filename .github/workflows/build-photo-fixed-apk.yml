name: ACR OS Pro 1.7.9 - Monitoramento RHiD (compilacao e assinatura segura)

on:
  pull_request:
    paths:
      - '.github/workflows/build-photo-fixed-apk.yml'
      - 'scripts/fix-photo-picker.py'
      - 'scripts/fix-document-picker.py'
      - 'scripts/add-user-permissions-v174.py'
      - 'scripts/add-catalog-v175.py'
      - 'scripts/catalog-v175.js'
      - 'scripts/add-travel-v176.py'
      - 'scripts/travel-v176.js'
      - 'scripts/add-reports-v177.py'
      - 'scripts/reports-v177.js'
      - 'scripts/reports-panel-v177.html'
      - 'scripts/ExtendedReportExport-v177.kt'
      - 'backend/report-analytics.js'
      - 'backend/travel.js'
      - 'scripts/add-licenses-v178.py'
      - 'scripts/licenses-v178.js'
      - 'scripts/licenses-panel-v178.html'
      - 'backend/license-utils.js'
      - 'backend/rhid-monitor.js'
      - 'backend/rhid-domains.js'
      - 'backend/team-api.js'
      - 'backend/tests/rhid-monitor.test.js'
      - 'scripts/add-rhid-v179.py'
      - 'scripts/add-recovery-v180.py'
      - 'scripts/add-service-desk-v181.py'
      - 'scripts/service-desk-ui-v181.js'
      - 'scripts/recovery-ui-v180.js'
      - 'scripts/rhid-v179.js'
      - 'scripts/rhid-panel-v179.html'
      - 'scripts/sign-android-update.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-photo-fixed-apk.yml'
      - 'scripts/fix-photo-picker.py'
      - 'scripts/fix-document-picker.py'
      - 'scripts/add-user-permissions-v174.py'
      - 'scripts/add-catalog-v175.py'
      - 'scripts/catalog-v175.js'
      - 'scripts/add-travel-v176.py'
      - 'scripts/travel-v176.js'
      - 'scripts/add-reports-v177.py'
      - 'scripts/reports-v177.js'
      - 'scripts/reports-panel-v177.html'
      - 'scripts/ExtendedReportExport-v177.kt'
      - 'backend/report-analytics.js'
      - 'backend/travel.js'
      - 'scripts/add-licenses-v178.py'
      - 'scripts/licenses-v178.js'
      - 'scripts/licenses-panel-v178.html'
      - 'backend/license-utils.js'
      - 'backend/rhid-monitor.js'
      - 'backend/rhid-domains.js'
      - 'backend/team-api.js'
      - 'backend/tests/rhid-monitor.test.js'
      - 'scripts/add-rhid-v179.py'
      - 'scripts/add-recovery-v180.py'
      - 'scripts/add-service-desk-v181.py'
      - 'scripts/service-desk-ui-v181.js'
      - 'scripts/recovery-ui-v180.js'
      - 'scripts/rhid-v179.js'
      - 'scripts/rhid-panel-v179.html'
      - 'scripts/sign-android-update.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar versão e aplicar correção das fotos
        shell: bash
        run: |
          set -euo pipefail
          unzip -q OSPro-Eletrica-Software-Fonte.zip
          base64 --decode scripts/ospro-v1.6-patch.tgz.b64 > /tmp/ospro-v16.tgz
          echo "4dfd83a3d7cd5ec538d599d0d7a840bcc2511c3f9da31efd4339fc3c2c41fc4e  /tmp/ospro-v16.tgz" | sha256sum -c -
          tar -xzf /tmp/ospro-v16.tgz -C ospro-eletrica-software
          base64 --decode scripts/ospro-v1.7-overlay.tgz.b64 > /tmp/ospro-v17.tgz
          echo "4d9776c030443ce84ca5fced0794319846e27588b37107a6926e71feca6998d8  /tmp/ospro-v17.tgz" | sha256sum -c -
          tar -xzf /tmp/ospro-v17.tgz -C ospro-eletrica-software
          python scripts/fix-photo-picker.py ospro-eletrica-software
          python scripts/fix-document-picker.py ospro-eletrica-software
          python scripts/add-user-permissions-v174.py ospro-eletrica-software
          python scripts/add-catalog-v175.py ospro-eletrica-software
          python scripts/add-travel-v176.py ospro-eletrica-software
          python scripts/add-reports-v177.py ospro-eletrica-software
          python scripts/add-licenses-v178.py ospro-eletrica-software
          python scripts/add-rhid-v179.py ospro-eletrica-software
          python scripts/add-recovery-v180.py ospro-eletrica-software
          python scripts/add-service-desk-v181.py ospro-eletrica-software
          node --check ospro-eletrica-software/app/src/main/assets/service-desk-ui.js
          node --check ospro-eletrica-software/app/src/main/assets/recovery-ui.js
          node --check ospro-eletrica-software/app/src/main/assets/rhid.js
          node --check ospro-eletrica-software/app/src/main/assets/licenses.js
          node --check ospro-eletrica-software/app/src/main/assets/license-utils.js
          node --check ospro-eletrica-software/app/src/main/assets/reports.js
          node --check ospro-eletrica-software/app/src/main/assets/report-model.js
          node --check ospro-eletrica-software/app/src/main/assets/travel-core.js
          node --check ospro-eletrica-software/app/src/main/assets/travel.js
          node --check ospro-eletrica-software/app/src/main/assets/catalog.js
          node --check ospro-eletrica-software/app/src/main/assets/auth.js
          node --check ospro-eletrica-software/app/src/main/assets/permissions.js
          node --check ospro-eletrica-software/app/src/main/assets/app.js
          grep -q 'versionName = "1.7.10"' ospro-eletrica-software/app/build.gradle.kts
          python - <<'PY'
          from pathlib import Path
          root=Path('ospro-eletrica-software/app/src/main')
          code=(root/'java/br/com/ospro/ordens/MainActivity.kt').read_text()
          h=(root/'assets/index.html').read_text()
          assert (root/'assets/permissions.js').exists()
          assert (root/'assets/catalog.js').exists()
          assert (root/'assets/travel-core.js').exists()
          assert (root/'assets/travel.js').exists()
          assert (root/'assets/reports.js').exists()
          assert (root/'assets/licenses.js').exists()
          assert (root/'assets/rhid.js').exists()
          assert 'id="rhid-equipment-list"' in h
          assert 'data-tab="rhid"' in h
          assert 'data-permission="rhid"' in h
          assert '"rhid"->"Monitoramento-RHiD"' in code
          assert (root/'assets/license-utils.js').exists()
          assert 'id="license-form"' in h
          assert 'name="quantidade"' in h and 'name="valorUnitario"' in h
          assert 'name="vencimento"' in h and 'name="status"' in h
          assert 'id="license-export-pdf"' in h
          assert 'data-permission="licencas"' in h
          assert '"licenses"->"Licencas-Software"' in code
          assert (root/'assets/report-model.js').exists()
          assert 'id="report-equipment"' in h
          assert 'id="report-travel"' in h
          assert 'id="report-catalog"' in h
          assert 'data-report-export="equipment"' in h
          assert 'data-report-export="travel"' in h
          assert (root/'java/br/com/ospro/ordens/ExtendedReportExport.kt').exists()
          assert 'ExtendedReportExport.writePdf' in code
          assert 'ExtendedReportExport.writeXlsx' in code
          assert 'id="trip-form"' in h
          assert 'name="kmInicial"' in h and 'name="kmAtual"' in h
          assert 'name="abastecimento"' in h and 'name="tanqueCompleto"' in h
          assert 'name="hospedagem"' in h and 'name="alimentacao"' in h
          assert 'name="incluirAbastecimento"' in h
          assert 'id="catalog-equipments-form"' in h
          assert 'name="serie"' in h and 'name="ip"' in h and 'name="mac"' in h
          assert 'name="tipo" list="catalog-type-suggestions"' in h
          assert 'data-permission="catalogo"' in h
          assert 'id="permissions-form"' in h
          assert 'id="permission-user"' in h
          assert 'id="permissions.js"' not in h or 'src="permissions.js"' in h
          assert 'Intent(Intent.ACTION_OPEN_DOCUMENT)' in code
          assert code.count('Intent(MediaStore.ACTION_IMAGE_CAPTURE)') == 1
          assert 'val cameraRequested = params.isCaptureEnabled && onlyImages' in code
          assert 'params.createIntent()' not in code
          assert 'govPdfPicker.launch(arrayOf("application/pdf"))' in code
          assert 'id="photo-camera" type="file" accept="image/*" capture="environment"' in h
          assert 'id="photo-input" type="file" accept="image/*" hidden' in h
          assert 'id="restore-input" type="file" accept="application/json"' in h
          print('Validado: documentos e galeria vão para Arquivos; apenas Tirar foto usa câmera.')
          PY
          grep -q 'id="photo-camera"' ospro-eletrica-software/app/src/main/assets/index.html

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -path '*/bin/sdkmanager' -type f | head -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # PR / push: valida código Android sem gerar APK instalável de assinatura efêmera.
      - name: Testar compilação Android (DEBUG NÃO É DISTRIBUÍDO)
        working-directory: ospro-eletrica-software
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      # Só workflow_dispatch no branch main pode publicar um APK para atualização.
      # As credenciais e o fingerprint do certificado ORIGINAL são obrigatórios.
      - name: Compilar release não assinada
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: ospro-eletrica-software
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Assinar com certificado ORIGINAL e validar fingerprint
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ACR_KEYSTORE_B64: ${{ secrets.ACR_KEYSTORE_B64 }}
          ACR_KEYSTORE_PASSWORD: ${{ secrets.ACR_KEYSTORE_PASSWORD }}
          ACR_KEY_ALIAS: ${{ secrets.ACR_KEY_ALIAS }}
          ACR_KEY_PASSWORD: ${{ secrets.ACR_KEY_PASSWORD }}
          ACR_SIGNER_SHA256: ${{ vars.ACR_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          bash scripts/sign-android-update.sh ospro-eletrica-software dist/ACR-OS-Pro-v1.7.10-Atualizacao-Assinada.apk

      - name: Publicar SOMENTE APK validado (nunca DEBUG)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ACR-OS-Pro-v1.7.10-Atualizacao-Assinada
          path: dist/ACR-OS-Pro-v1.7.10-Atualizacao-Assinada.apk
          retention-days: 30
          if-no-files-found: error

      - name: Disponibilizar código-fonte corrigido
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path('ospro-eletrica-software')
          with ZipFile('ACR-OS-Pro-v1.7.10-Fonte.zip', 'w', ZIP_DEFLATED) as archive:
              for item in root.rglob('*'):
                  if item.is_file() and not {'.gradle','build','.idea'}.intersection(item.parts):
                      archive.write(item)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ACR-OS-Pro-v1.7.10-Fonte
          path: ACR-OS-Pro-v1.7.10-Fonte.zip
          retention-days: 30
          if-no-files-found: error
