name: ACR OS Pro v1.7 - Equipe e Login Central
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-v17.yml
      - scripts/ospro-v1.7-overlay.tgz.b64
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4

      - name: Aplicar versoes 1.6 e 1.7
        shell: bash
        run: |
          unzip -q OSPro-Eletrica-Software-Fonte.zip
          base64 --decode scripts/ospro-v1.6-patch.tgz.b64 > /tmp/v16.tgz
          echo "4dfd83a3d7cd5ec538d599d0d7a840bcc2511c3f9da31efd4339fc3c2c41fc4e  /tmp/v16.tgz" | sha256sum -c -
          tar -xzf /tmp/v16.tgz -C ospro-eletrica-software
          base64 --decode scripts/ospro-v1.7-overlay.tgz.b64 > /tmp/v17.tgz
          echo "4d9776c030443ce84ca5fced0794319846e27588b37107a6926e71feca6998d8  /tmp/v17.tgz" | sha256sum -c -
          tar -xzf /tmp/v17.tgz -C ospro-eletrica-software
          node --check ospro-eletrica-software/app/src/main/assets/auth.js
          node --check ospro-eletrica-software/app/src/main/assets/app.js
          node --check ospro-eletrica-software/server/team-api.js
          node --check ospro-eletrica-software/server/server.js
          grep -q "window.OSProVersion = '1.7.0'" ospro-eletrica-software/app/src/main/assets/app.js
          grep -q 'versionName = "1.7.0"' ospro-eletrica-software/app/build.gradle.kts
          cd ospro-eletrica-software/server
          npm test

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -path '*/bin/sdkmanager' -type f | head -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Gerar APK
        working-directory: ospro-eletrica-software
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Confirmar APK
        run: test -s ospro-eletrica-software/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK 1.7
        uses: actions/upload-artifact@v4
        with:
          name: ACR-OS-Pro-v1.7-APK
          path: ospro-eletrica-software/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Preparar ZIP do codigo-fonte atualizado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path('ospro-eletrica-software')
          with ZipFile('ACR-OS-Pro-v1.7-Fonte.zip','w',ZIP_DEFLATED) as z:
              for f in root.rglob('*'):
                  if f.is_file() and not {'.gradle','build','.idea'}.intersection(f.parts):
                      z.write(f)
          PY

      - name: Disponibilizar codigo-fonte
        uses: actions/upload-artifact@v4
        with:
          name: ACR-OS-Pro-v1.7-Fonte
          path: ACR-OS-Pro-v1.7-Fonte.zip
          retention-days: 30
          if-no-files-found: error
