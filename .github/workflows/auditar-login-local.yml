name: Auditar login para armazenamento local
on:
  push:
    branches: [acr-os-pro-local]
    paths:
      - 'scripts/auditar-login-local.py'
      - '.github/workflows/auditar-login-local.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditar-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar código Android
        shell: bash
        run: |
          set -euo pipefail
          unzip -q OSPro-Eletrica-Software-Fonte.zip
          base64 --decode scripts/ospro-v1.6-patch.tgz.b64 > /tmp/v16.tgz
          echo '4dfd83a3d7cd5ec538d599d0d7a840bcc2511c3f9da31efd4339fc3c2c41fc4e  /tmp/v16.tgz' | sha256sum -c -
          tar -xzf /tmp/v16.tgz -C ospro-eletrica-software
          base64 --decode scripts/ospro-v1.7-overlay.tgz.b64 > /tmp/v17.tgz
          echo '4d9776c030443ce84ca5fced0794319846e27588b37107a6926e71feca6998d8  /tmp/v17.tgz' | sha256sum -c -
          tar -xzf /tmp/v17.tgz -C ospro-eletrica-software
          python scripts/add-user-permissions-v174.py ospro-eletrica-software
          python scripts/add-catalog-v175.py ospro-eletrica-software
          python scripts/add-travel-v176.py ospro-eletrica-software
          python scripts/add-reports-v177.py ospro-eletrica-software
          python scripts/add-licenses-v178.py ospro-eletrica-software
          python scripts/add-rhid-v179.py ospro-eletrica-software
          python scripts/add-recovery-v180.py ospro-eletrica-software
          python scripts/add-service-desk-v181.py ospro-eletrica-software
          python scripts/add-finished-orders-v1711.py ospro-eletrica-software
          python scripts/add-local-store-v1.py ospro-eletrica-software
      - name: Auditar login sem imprimir credenciais
        run: python scripts/auditar-login-local.py ospro-eletrica-software
