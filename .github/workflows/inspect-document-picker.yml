name: Inspecionar abertura de documentos ACR
on:
  pull_request:
    paths:
      - '.github/workflows/inspect-document-picker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar fonte vigente e inspecionar documentos
        shell: bash
        run: |
          set -euo pipefail
          unzip -q OSPro-Eletrica-Software-Fonte.zip
          base64 --decode scripts/ospro-v1.6-patch.tgz.b64 > /tmp/v16.tgz
          tar -xzf /tmp/v16.tgz -C ospro-eletrica-software
          base64 --decode scripts/ospro-v1.7-overlay.tgz.b64 > /tmp/v17.tgz
          tar -xzf /tmp/v17.tgz -C ospro-eletrica-software
          python scripts/fix-photo-picker.py ospro-eletrica-software
          echo '=== MAIN ACTIVITY ==='
          sed -n '1,290p' ospro-eletrica-software/app/src/main/java/br/com/ospro/ordens/MainActivity.kt
          echo '=== HTML FILE INPUTS AND DOCUMENT LABELS ==='
          grep -nEi 'document|arquivo|camera|câmera|foto|pdf|gov|upload|file|capture' ospro-eletrica-software/app/src/main/assets/index.html | head -110 || true
          echo '=== JS DOCUMENT EVENTS ==='
          grep -nEi 'document|arquivo|camera|câmera|foto|pdf|gov|upload|file' ospro-eletrica-software/app/src/main/assets/app.js | tail -100 || true
