name: Testar prototipo de login local
on:
  push:
    branches: [acr-os-pro-local]
    paths:
      - 'scripts/local-auth-prototype.js'
      - 'scripts/test-local-auth-prototype.cjs'
      - '.github/workflows/test-local-auth-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/local-auth-prototype.js
      - run: node scripts/test-local-auth-prototype.cjs
