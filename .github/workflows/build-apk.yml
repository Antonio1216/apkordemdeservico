name: Compilar ACR OS Pro v1.6 - Relatorios e GPS
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-apk.yml
      - scripts/ospro-v1.6-patch.tgz.b64
      - OSPro-Eletrica-Software-Fonte.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar projeto Android e atualizacao
        shell: bash
        run: |
          unzip -q OSPro-Eletrica-Software-Fonte.zip
          test -f ospro-eletrica-software/app/build.gradle.kts
          base64 --decode scripts/ospro-v1.6-patch.tgz.b64 > /tmp/ospro-patch-v16.tgz
          echo '4dfd83a3d7cd5ec538d599d0d7a840bcc2511c3f9da31efd4339fc3c2c41fc4e  /tmp/ospro-patch-v16.tgz' | sha256sum -c -
          tar -xzf /tmp/ospro-patch-v16.tgz -C ospro-eletrica-software
          node --check ospro-eletrica-software/app/src/main/assets/app.js
          node --check ospro-eletrica-software/app/src/main/assets/auth.js
          grep -q 'window.OSProVersion = '\''1.6.0'\''' ospro-eletrica-software/app/src/main/assets/app.js
          grep -q 'id="report-client"' ospro-eletrica-software/app/src/main/assets/index.html
          grep -q 'id="capture-sign-gps"' ospro-eletrica-software/app/src/main/assets/index.html
          grep -q 'versionName = "1.6.0"' ospro-eletrica-software/app/build.gradle.kts
          cd ospro-eletrica-software/server && npm test

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -path '*/bin/sdkmanager' -type f | head -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        working-directory: ospro-eletrica-software
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Conferir APK
        run: test -s ospro-eletrica-software/app/build/outputs/apk/debug/app-debug.apk

      - name: APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ACR-OS-Pro-v1.6-APK
          path: ospro-eletrica-software/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Codigo fonte atualizado
        shell: bash
        run: |
          python - <<'PY'
          from zipfile import ZipFile,ZIP_DEFLATED
          from pathlib import Path
          root=Path('ospro-eletrica-software')
          with ZipFile('ACR-OS-Pro-v1.6-Fonte.zip','w',ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and not {'.gradle','build','.idea'}.intersection(p.parts):
                      z.write(p)
          PY
      - name: Fonte para download
        uses: actions/upload-artifact@v4
        with:
          name: ACR-OS-Pro-v1.6-Fonte
          path: ACR-OS-Pro-v1.6-Fonte.zip
          if-no-files-found: error
          retention-days: 30
