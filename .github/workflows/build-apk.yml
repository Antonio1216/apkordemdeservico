name: Gerar APK Android ACR Suporte em T.I v1.4
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Extrair código-fonte OS Pro
        shell: bash
        run: |
          unzip -q "OSPro-Eletrica-Software-Fonte.zip"
          test -f ospro-eletrica-software/settings.gradle.kts
          test -f ospro-eletrica-software/app/build.gradle.kts

      - name: Aplicar melhorias v1.2
        shell: bash
        run: |
          if ! grep -q "OSProVersion = '1.4.0'" ospro-eletrica-software/app/src/main/assets/app.js && ! grep -q "OSProVersion = '1.2.0'" ospro-eletrica-software/app/src/main/assets/app.js; then
            if ! grep -q 'id="sign-name"' ospro-eletrica-software/app/src/main/assets/index.html; then
              base64 --decode scripts/apply-signature-name.py.gz.b64 | gzip -dc > /tmp/apply-name.py
              python /tmp/apply-name.py
            fi
            python - <<'PY'
          from pathlib import Path
          root=Path('ospro-eletrica-software')
          j=root/'app/src/main/assets/app.js'
          s=j.read_text();nl=chr(10)
          old='signName.value=a?.name||pendingSignNames[activeRole]||signSuggestedName();signName.readOnly=!!a;'+nl+'    displaySignature(a?.image||null);updateSignButtons();'
          new='signName.value=a?.name||pendingSignNames[activeRole]||signSuggestedName();'+nl+'    signName.readOnly=!!a;'+nl+'    displaySignature(a?.image||null);'+nl+'    updateSignButtons();'
          s=s.replace(old,new)
          j.write_text(s)
          k=root/'app/src/main/java/br/com/ospro/ordens/MainActivity.kt'
          s=k.read_text()
          needle='        img(obj.optString("image"),245f,83f)'
          if 'if(obj.optString("name").isNotBlank())field("Nome declarado"' not in s:
              s=s.replace(needle,needle+nl+'        if(obj.optString("name").isNotBlank())field("Nome declarado",obj.optString("name"))')
          k.write_text(s)
          PY
            base64 --decode scripts/apply-v1-2.py.gz.b64 | gzip -dc > /tmp/update-ospro.py
            python /tmp/update-ospro.py
          fi
          node --check ospro-eletrica-software/app/src/main/assets/app.js
          grep -q 'id="signature-name-preview"' ospro-eletrica-software/app/src/main/assets/index.html
          grep -q 'id="logo-file"' ospro-eletrica-software/app/src/main/assets/index.html
          grep -q 'field("Nome do assinante"' ospro-eletrica-software/app/src/main/java/br/com/ospro/ordens/MainActivity.kt
          cd ospro-eletrica-software && node --test server/tests/server.test.js

      - name: Aplicar assinatura remota e PDF v1.3
        shell: bash
        run: |
          if ! grep -q "OSProVersion = '1.4.0'" ospro-eletrica-software/app/src/main/assets/app.js; then
            base64 --decode scripts/v1.3-server-patch.tgz.b64 > /tmp/ospro-v13.tar.gz
          echo '2ccafcebdc351173157ae0aba81a35fcb822ef095cc5be2989e0fa3db01445ae  /tmp/ospro-v13.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ospro-v13.tar.gz -C ospro-eletrica-software
          python ospro-eletrica-software/patch_app.py ospro-eletrica-software
          rm ospro-eletrica-software/patch_app.py
          node --check ospro-eletrica-software/server/server.js
          node --check ospro-eletrica-software/server/pdf.js
          node --check ospro-eletrica-software/server/public/sign.js
          node --check ospro-eletrica-software/app/src/main/assets/app.js
          grep -q "OSProVersion = '1.3.0'" ospro-eletrica-software/app/src/main/assets/app.js
          grep -q 'Baixar meu PDF assinado' ospro-eletrica-software/server/public/sign.html
          sed -i 's/Assinatura eletrônica na tela/Visualizar documento em PDF/' ospro-eletrica-software/server/tests/server.test.js
            cd ospro-eletrica-software/server && npm test
          else
            cd ospro-eletrica-software/server && npm test
          fi

      - name: Aplicar identidade ACR v1.4
        shell: bash
        run: |
          if grep -q "OSProVersion = '1.4.0'" ospro-eletrica-software/app/src/main/assets/app.js; then
            echo "Identidade ACR já faz parte do código-fonte."
            echo "OSPRO_BRAND_BUNDLED=1" >> "$GITHUB_ENV"
          else
            base64 --decode scripts/acr-brand-v1.4-overlay.tgz.b64 > /tmp/ospro-acr-v14.tar.gz
            echo "cc2438899e3745a70175c5301bd9f0c5cba6ae5985db59bdc464721624325a95  /tmp/ospro-acr-v14.tar.gz" | sha256sum -c -
            tar -xzf /tmp/ospro-acr-v14.tar.gz -C ospro-eletrica-software
            echo "OSPRO_BRAND_BUNDLED=0" >> "$GITHUB_ENV"
          fi
          node --check ospro-eletrica-software/app/src/main/assets/app.js
          grep -q "OSProVersion = '1.4.0'" ospro-eletrica-software/app/src/main/assets/app.js
          grep -q 'ACR Suporte em T.I' ospro-eletrica-software/app/src/main/assets/index.html
          test -s ospro-eletrica-software/app/src/main/assets/brand/acr-logo.jpg
          test -s ospro-eletrica-software/app/src/main/assets/brand/acr-mark.jpg
          test -s ospro-eletrica-software/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -path '*/bin/sdkmanager' -type f | head -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK Android
        working-directory: ospro-eletrica-software
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verificar APK gerado
        run: test -s ospro-eletrica-software/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: OSPro-Eletrica-Software-APK
          path: ospro-eletrica-software/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Atualizar ZIP do código-fonte no repositório
        if: ${{ success() && env.OSPRO_BRAND_BUNDLED == '0' }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          folder=Path('ospro-eletrica-software')
          with ZipFile('OSPro-Eletrica-Software-Fonte.zip','w',ZIP_DEFLATED) as z:
              for file in folder.rglob('*'):
                  if file.is_file() and not {'.gradle','build','.idea'}.intersection(file.parts):
                      z.write(file)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OSPro-Eletrica-Software-Fonte.zip
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar fonte OS Pro v1.4 ACR Suporte em T.I"
            git push
          fi
