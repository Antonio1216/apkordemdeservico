name: Gerar APK Android OS Pro v1.2
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Extrair código-fonte OS Pro
        shell: bash
        run: |
          unzip -q "OSPro-Eletrica-Software-Fonte.zip"
          test -f ospro-eletrica-software/settings.gradle.kts
          test -f ospro-eletrica-software/app/build.gradle.kts

      - name: Aplicar melhorias v1.2
        shell: bash
        run: |
          if ! grep -q "OSProVersion = '1.2.0'" ospro-eletrica-software/app/src/main/assets/app.js; then
            if ! grep -q 'id="sign-name"' ospro-eletrica-software/app/src/main/assets/index.html; then
              base64 --decode scripts/apply-signature-name.py.gz.b64 | gzip -dc > /tmp/apply-name.py
              python /tmp/apply-name.py
            fi
            python - <<'PY'
          from pathlib import Path
          root=Path('ospro-eletrica-software')
          j=root/'app/src/main/assets/app.js'
          s=j.read_text()
          s=s.replace('signName.value=a?.name||pendingSignNames[activeRole]||signSuggestedName();signName.readOnly=!!a;\\n    displaySignature(a?.image||null);updateSignButtons();'.replace('\\n','\n'), 'signName.value=a?.name||pendingSignNames[activeRole]||signSuggestedName();\\n    signName.readOnly=!!a;\\n    displaySignature(a?.image||null);\\n    updateSignButtons();'.replace('\\n','\n'))
          j.write_text(s)
          k=root/'app/src/main/java/br/com/ospro/ordens/MainActivity.kt'
          s=k.read_text()
          needle='        img(obj.optString("image"),245f,83f)'
          if 'if(obj.optString("name").isNotBlank())field("Nome declarado"' not in s:
              s=s.replace(needle,needle+'\\n        if(obj.optString("name").isNotBlank())field("Nome declarado",obj.optString("name"))'.replace('\\n','\n'))
          k.write_text(s)
          PY
            base64 --decode scripts/apply-v1-2.py.gz.b64 | gzip -dc > /tmp/update-ospro.py
            python /tmp/update-ospro.py
          fi
          node --check ospro-eletrica-software/app/src/main/assets/app.js
          grep -q 'id="signature-name-preview"' ospro-eletrica-software/app/src/main/assets/index.html
          grep -q 'id="logo-file"' ospro-eletrica-software/app/src/main/assets/index.html
          grep -q 'field("Nome do assinante"' ospro-eletrica-software/app/src/main/java/br/com/ospro/ordens/MainActivity.kt
          cd ospro-eletrica-software && node --test server/tests/server.test.js

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -path '*/bin/sdkmanager' -type f | head -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK Android
        working-directory: ospro-eletrica-software
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verificar APK gerado
        run: test -s ospro-eletrica-software/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: OSPro-Eletrica-Software-APK
          path: ospro-eletrica-software/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Atualizar ZIP do código-fonte no repositório
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          folder=Path('ospro-eletrica-software')
          with ZipFile('OSPro-Eletrica-Software-Fonte.zip','w',ZIP_DEFLATED) as z:
              for file in folder.rglob('*'):
                  if file.is_file() and not {'.gradle','build','.idea'}.intersection(file.parts):
                      z.write(file)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OSPro-Eletrica-Software-Fonte.zip
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar fonte OS Pro v1.2 com logo e assinatura"
            git push
          fi
